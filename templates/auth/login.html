{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5">

        <div class="auth-card card shadow-lg border-0">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <div class="auth-logo mb-3">
                <i class="bi bi-graph-up-arrow"></i>
              </div>
              <h2 class="fw-bold">Welcome back</h2>
              <p class="text-muted">Sign in to your Alchemy account</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

              <!-- Identifier -->
              <div class="mb-3">
                <label for="identifier" class="form-label fw-medium">Username or Email</label>
                <div class="input-group input-flat">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="identifier" name="identifier"
                         class="form-control form-control-lg"
                         placeholder=""
                         value="{{ request.form.identifier or '' }}"
                         autocomplete="username" required autofocus>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="password" class="form-label fw-medium">Password</label>
                <div class="input-group input-flat">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" name="password"
                         class="form-control form-control-lg"
                         placeholder=""
                         autocomplete="current-password" required>
                  <button class="btn btn-icon-flat" type="button"
                          onclick="togglePassword('password', this)">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Remember me -->
              <div class="mb-4 form-check">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Remember me for 8 hours</label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
              </button>
            </form>

            <hr class="my-4">
            <div class="text-center">
              <p class="text-muted mb-2">Don't have an account yet?</p>
              <a href="{{ url_for('auth.register') }}" class="btn btn-outline-primary w-100">
                <i class="bi bi-person-plus me-2"></i>Create a Free Account
              </a>
            </div>

          </div>
        </div>

        <!-- Watermark -->
        <p class="text-center text-muted small mt-3">
          Created by <strong>Francis Njoroge</strong> &mdash;
          <a href="mailto:njorogefrancis.dev@gmail.com" class="text-muted">njorogefrancis.dev@gmail.com</a>
        </p>

      </div>
    </div>
  </div>
</div>
{% endblock %}
